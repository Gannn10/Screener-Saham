name: BSJP Auto Screener

on:
  schedule:
    # Jam 08:20 UTC = 15:20 WIB (UTC+7)
    - cron: '20 8 * * 1-5'
  # Bisa juga dijalankan manual dari GitHub
  workflow_dispatch:

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install library
        run: |
          pip install yfinance pandas numpy colorama requests schedule beautifulsoup4

      - name: Jalankan BSJP Screener
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bsjp_auto.py
